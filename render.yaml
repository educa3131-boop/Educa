services:
  - type: web
    name: educa-mz
    runtime: docker
    repo: https://github.com/educa3131-boop/Educa
    branch: main
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATA_DIR
        value: /data
      - key: COOKIE_SECURE
        value: true
      - key: EXPOSE_DEV_LINKS
        value: false
      - key: ADMIN_EMAIL
        value: admin@educa.mz
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: "EDUCA <no-reply@educa.mz>"
    disk:
      name: educa-data
      mountPath: /data
      sizeGB: 1
