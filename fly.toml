app = "educa-mz"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATA_DIR = "/data"
  COOKIE_SECURE = "true"
  EXPOSE_DEV_LINKS = "false"
  ADMIN_EMAIL = "admin@educa.mz"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[volumes]]
  source = "educa_data"
  destination = "/data"
